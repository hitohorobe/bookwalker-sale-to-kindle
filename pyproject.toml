[project]
name = "bookwalker-sale-to-kindle"
version = "0.1.0"
description = ""
authors = [{name = "hito_horobe"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.3",
    "python-amazon-paapi>=6.2.0",
    "requests-cache>=1.2.1",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "mypy>=2.3.0",
    "pre-commit>=4.1.0",
    "ruff>=0.9.3",
]

[tool.ruff]
exclude = [".venv", ".pytest_cache", ".git"]

[tool.ruff.lint]
select = ["I", "N"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.uv]
package = false
